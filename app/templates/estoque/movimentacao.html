{% extends "base.html" %}

{% block title %}Registrar Movimentação - IceWebCream 2.0{% endblock %}

{% block content %}
<div class="form-card">
    <h2 class="page-title">Registrar Entrada, Saída ou Ajuste de Estoque</h2>
    <div class="title-underline"></div>

    <!-- Feedback visual de sucesso/erro -->
    <div id="mensagem-status" class="alerta oculto" role="status" aria-live="polite"></div>

    <form id="form-movimentacao-dedicado" novalidate>
        <div class="form-group">
            <label for="select-produto">Produto:</label>
            <select id="select-produto" name="produto_id" required>
                <option value="">Carregando produtos...</option>
            </select>
        </div>

        <div class="form-group">
            <label for="select-tipo">Tipo de Movimentação:</label>
            <select id="select-tipo" name="tipo" required>
                <option value="ENTRADA">Entrada (Chegou mercadoria nova)</option>
                <option value="SAIDA">Saída (Consumo ou desperdício)</option>
                <option value="AJUSTE">Ajuste (Contagem física na prateleira)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="input-quantidade">Quantidade:</label>
            <input type="number" id="input-quantidade" name="quantidade" step="0.1" min="0.1" placeholder="Ex: 5.0"
                required>
        </div>

        <div class="form-group">
            <label for="input-motivo">Observação (Opcional):</label>
            <input type="text" id="input-motivo" name="motivo" placeholder="Ex: Compra da semana, validade vencida...">
        </div>

        <!-- Botão idêntico à Figura 13 da Tishi Sorvetes -->
        <button type="submit" class="btn-submit-tishi" id="btn-salvar-movimentacao">
            Salvar Movimentação
        </button>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener("DOMContentLoaded", async () => {
        const selectProd = document.getElementById("select-produto");
        const form = document.getElementById("form-movimentacao-dedicado");
        const msg = document.getElementById("mensagem-status");
        const btnSalvar = document.getElementById("btn-salvar-movimentacao");

        function exibirMsg(texto, tipo = "sucesso") {
            msg.textContent = texto;
            msg.className = `alerta alerta-${tipo}`;
            msg.classList.remove("oculto");
            setTimeout(() => msg.classList.add("oculto"), 4000);
        }

        // Carregar produtos via API REST
        try {
            const res = await fetch("/api/produtos");
            const produtos = await res.json();
            selectProd.innerHTML = '<option value="">Selecione o produto...</option>';
            produtos.forEach(p => {
                const opt = document.createElement("option");
                opt.value = p.id;
                opt.textContent = `${p.sku} - ${p.nome} (Atual: ${p.quantidade_atual.toFixed(1)} ${p.unidade_medida})`;
                selectProd.appendChild(opt);
            });
        } catch (e) {
            selectProd.innerHTML = '<option value="">Erro ao carregar produtos</option>';
        }

        // Envio assíncrono via Fetch API
        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const produtoId = selectProd.value;
            const tipo = document.getElementById("select-tipo").value;
            const inputQtd = document.getElementById("input-quantidade");
            const inputMotivo = document.getElementById("input-motivo");

            const quantidade = parseFloat(inputQtd ? inputQtd.value : 0);
            const motivo = inputMotivo ? inputMotivo.value.trim() : "";

            if (!produtoId) {
                exibirMsg("Selecione um produto.", "erro");
                return;
            }
            if (isNaN(quantidade) || quantidade <= 0) {
                exibirMsg("Informe uma quantidade válida superior a zero.", "erro");
                return;
            }

            const payload = {
                produto_id: parseInt(produtoId),
                tipo: tipo,
                quantidade: quantidade,
                motivo: motivo
            };

            try {
                btnSalvar.disabled = true;
                btnSalvar.textContent = "Salvando...";

                const res = await fetch("/api/movimentacoes", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.erro || "Falha ao registrar.");

                exibirMsg(data.mensagem, "sucesso");
                form.reset();

                // Recarregar os saldos no dropdown
                const resReload = await fetch("/api/produtos");
                const produtosAtualizados = await resReload.json();
                selectProd.innerHTML = '<option value="">Selecione o produto...</option>';
                produtosAtualizados.forEach(p => {
                    const opt = document.createElement("option");
                    opt.value = p.id;
                    opt.textContent = `${p.sku} - ${p.nome} (Atual: ${p.quantidade_atual.toFixed(1)} ${p.unidade_medida})`;
                    selectProd.appendChild(opt);
                });

            } catch (err) {
                exibirMsg(err.message, "erro");
            } finally {
                btnSalvar.disabled = false;
                btnSalvar.textContent = "Salvar Movimentação";
            }
        });
    });
</script>
{% endblock %}
