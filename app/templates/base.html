<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IceWebCream 2.0{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="app-wrapper">
        <!-- Topo com Identidade e Saudação (Figura 5 do PI1) -->
        <header class="top-header" role="banner">
            <h1 class="brand-title">IceWEBcream <span>2.0</span></h1>
            <div class="user-status">
                Olá, <strong>Gestor</strong> | <span id="current-date">--/--/----</span>
            </div>
        </header>

        <!-- Barra de Navegação entre Telas -->
        <nav class="main-nav" role="navigation" aria-label="Menu principal">
            <a href="/" id="nav-inicio">Início (Estoque)</a>
            <a href="/cadastro" id="nav-cadastro">Cadastrar Novo Produto</a>
            <a href="/movimentacao" id="nav-movimentacao">Registrar Movimentação</a>
            <a href="/compras" id="nav-compras">Relatório de Compras</a>
        </nav>

        <!-- Conteúdo Principal -->
        <main class="main-content" role="main" id="conteudo-principal">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
        // Data formatada no topo como no protótipo
        const hoje = new Date();
        document.getElementById("current-date").textContent = hoje.toLocaleDateString("pt-BR");

        // Destaque visual do link ativo
        const path = window.location.pathname;
        if (path === "/") document.getElementById("nav-inicio")?.classList.add("active");
        if (path === "/cadastro") document.getElementById("nav-cadastro")?.classList.add("active");
        if (path === "/movimentacao") document.getElementById("nav-movimentacao")?.classList.add("active");
        if (path === "/compras") document.getElementById("nav-compras")?.classList.add("active");
    </script>
    {% block scripts %}{% endblock %}
</body>

</html>
