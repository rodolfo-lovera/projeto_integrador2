services:
  web:
    build: .
    container_name: icewebcream_app
    ports: 
      - "5000:5000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db    
    #environment:
    #  - FLASK_ENV=development
  
  db:
    image: postgres:15-alpine
    container_name: icewebcream_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: icewebcream
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:  
